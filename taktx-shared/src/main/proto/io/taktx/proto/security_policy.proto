syntax = "proto3";

package io.taktx.proto;

option java_package = "io.taktx.proto";
option java_multiple_files = true;
option java_outer_classname = "SecurityPolicyProto";

enum SecurityModeMessage {
  SECURITY_MODE_UNSPECIFIED = 0;
  OPEN = 1;
  ANCHORED = 2;
}

message NamespaceSecurityPolicyMessage {
  SecurityModeMessage mode = 1;
  optional int64 policy_version = 2;
  string policy_hash = 3;
}

