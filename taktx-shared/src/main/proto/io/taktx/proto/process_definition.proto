syntax = "proto3";

package io.taktx.proto;

option java_package = "io.taktx.proto";
option java_multiple_files = true;
option java_outer_classname = "ProcessDefinitionProto";

import "io/taktx/proto/definitions.proto";

// Java: ProcessDefinitionDTO
message ProcessDefinitionMessage {
  ParsedDefinitionsMessage definitions = 1;
  int32 version = 2;
  ProcessDefinitionStateEnum state = 3;
}
